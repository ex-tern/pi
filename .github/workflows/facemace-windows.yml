name: Face Mace for Windows

# Builds Face Mace's desktop program (back/rust/facemace-desktop) on Windows and publishes it as FaceMace.exe on the
# "facemace-windows" release, where the site's Download button points.
on:
  push:
    branches: [main]
    paths:
      - "back/rust/facemace-desktop/**"
      - "front/app/**"
      - "front/facemace/**"
      - ".github/workflows/facemace-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: facemace-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: back/rust/facemace-desktop
        run: cargo build --release --locked

      - name: Check it answers
        shell: bash
        run: |
          FACEMACE_NO_BROWSER=1 back/rust/facemace-desktop/target/release/facemace.exe 8791 &
          sleep 3
          curl -sf http://127.0.0.1:8791/facemace/ | grep -q "Face Mace"
          curl -sf -o /dev/null http://127.0.0.1:8791/app/ui.wasm
          cp back/rust/facemace-desktop/target/release/facemace.exe FaceMace.exe
          taskkill //IM facemace.exe //F || true

      # the installer (Inno Setup): Start menu and desktop shortcuts, an uninstaller, no administrator needed
      - name: Installer
        shell: bash
        run: |
          choco install innosetup -y --no-progress
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" //DMyVersion=1.0.${{ github.run_number }} back/rust/facemace-desktop/installer.iss
          ls -la dist
          cp dist/FaceMace-Setup.exe FaceMace-Setup.exe

      - name: Check the installer installs
        shell: pwsh
        run: |
          Start-Process -FilePath .\FaceMace-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Face Mace\FaceMace.exe'
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          Write-Host "installed: $exe"

      # installing again over it, while it runs, updates it in place (one install, the program replaced, running)
      - name: Check installing again updates it
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Face Mace\FaceMace.exe'
          $env:FACEMACE_NO_BROWSER = '1'
          $old = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 3
          $p = Start-Process -FilePath .\FaceMace-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installing again failed: exit $($p.ExitCode)" }
          if (Get-Process -Id $old.Id -ErrorAction SilentlyContinue) { throw "the running Face Mace was not closed" }
          $keys = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -eq 'Face Mace' }
          if (@($keys).Count -ne 1) { throw "expected one install, found $(@($keys).Count)" }
          Write-Host "updated in place: $exe, version $((Get-ItemProperty $keys[0].PSPath).DisplayVersion)"
          taskkill /IM FaceMace.exe /F 2>$null; exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: FaceMace-windows
          path: |
            FaceMace.exe
            FaceMace-Setup.exe

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete facemace-windows --yes --cleanup-tag || true
          gh release create facemace-windows FaceMace-Setup.exe FaceMace.exe \
            --title "Face Mace for Windows" \
            --notes "Sorts photos and videos by face, on your computer. FaceMace-Setup.exe installs it (Start menu and desktop shortcuts, uninstall from Settings > Apps; no administrator needed). FaceMace.exe runs without installing. It opens in your browser and quits a minute after its page is closed; no photo leaves the computer. Version 1.0.${{ github.run_number }}, built from ${GITHUB_SHA::7}." \
            --latest=false
