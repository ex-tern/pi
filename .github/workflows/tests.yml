name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: back
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: back
        run: pytest tests/ -v
        env:
          # Deliberately left empty — the scoring engine must work with no
          # LLM keys configured (falls back to the local Scilem model).
          GROQ_API_KEY: ""
          OR_API_KEY: ""
          GEMINI_API_KEY: ""

  rust:
    # the Rust side of the site: the SuperAI language and the constants (π, e, φ, γ), both built to WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SuperAI
        working-directory: back/rust/superai
        run: cargo test -q
      - name: Numbers
        working-directory: back/rust/numbers
        run: cargo test -q
