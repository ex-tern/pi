name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v
        env:
          # Deliberately left empty — the scoring engine must work with no
          # LLM keys configured (falls back to the local Scilem model).
          GROQ_API_KEY: ""
          OR_API_KEY: ""
          GEMINI_API_KEY: ""
