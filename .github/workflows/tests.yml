name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: back
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: back
        shell: bash
        run: |
          # failures also as annotations (readable through the API, where the full log may not be)
          set -o pipefail
          pytest tests/ -v -rfE --tb=short 2>&1 | tee /tmp/pytest.txt
          s=$?
          if [ $s -ne 0 ]; then
            grep -E "^(FAILED|ERROR) |^E   " /tmp/pytest.txt | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $s
        env:
          # Deliberately left empty — the scoring engine must work with no
          # LLM keys configured (falls back to the local Scilem model).
          GROQ_API_KEY: ""
          OR_API_KEY: ""
          GEMINI_API_KEY: ""

  rust:
    # the Rust side of the site: the front end (built to WebAssembly), the SuperAI language and the constants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SuperAI
        working-directory: back/rust/superai
        run: cargo test -q
      - name: Numbers
        working-directory: back/rust/numbers
        run: cargo test -q
      - name: Front end
        working-directory: back/rust/ui
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown
