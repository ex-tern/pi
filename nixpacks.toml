# Railway build: Python only (owner, 2026-10-13: "no docker"). Nixpacks's Python provider installs
# requirements.txt (the root one points at backend/requirements.txt) and runs the start command below.
#
# The Lab: HAL-OS stays its own repository. Its boot image is built here from a pinned commit, exactly as
# `python bitllm_kernel.py` builds it on a desktop, and served to the browser, which boots it with v86.
# back/scripts/tools.py build-hal refuses to build if frontend/hal/wire.js and HAL-OS disagree on the wire protocol. To ship a
# newer HAL-OS, change the ref. A failed fetch fails the build loudly rather than deploying a Lab with no machine.
[variables]
ENVIRONMENT = "production"
PYTHONUNBUFFERED = "1"
HAL_OS_REF = "7f2e094df20a3bf523a085445a2bc53ee76a703a"
HAL_OS_REPO = "https://github.com/neurophilic/HAL-OS"

[phases.setup]
nixPkgs = ["...", "curl", "gnutar", "gzip"]

[phases.build]
cmds = [
  "mkdir -p /tmp/hal-os && curl -fsSL \"https://codeload.github.com/neurophilic/HAL-OS/tar.gz/$HAL_OS_REF\" | tar xz -C /tmp/hal-os --strip-components=1",
  "python back/scripts/tools.py build-hal --src /tmp/hal-os --ref \"$HAL_OS_REF\" --repo \"$HAL_OS_REPO\" && rm -rf /tmp/hal-os",
]

[start]
# gunicorn.conf.py chdirs into backend/ itself (the start command runs from the repository root, with no shell)
cmd = "gunicorn api:app -c back/gunicorn.conf.py"
