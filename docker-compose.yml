services:
  scholarpi:
    build: .
    image: scholarpi:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - ENVIRONMENT=production
      - SCHOLARPI_DATA_DIR=/data
    volumes:
      - scholarpi_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  scholarpi_data:
