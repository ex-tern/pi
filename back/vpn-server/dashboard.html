<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>piii VPN</title>
<link rel="icon" href="/icon.svg">
<style>
:root{--bg:#f5f6f4;--card:#fff;--ink:#17191a;--muted:#646a6c;--line:#e0e3e1;--accent:#0f7a6b;--accent-ink:#fff;--ok:#1f8a4c;--warn:#b4561b;--bad:#b3261e;--soft:#e9f3f0;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121514;--card:#1a1e1d;--ink:#e8ecea;--muted:#9ba4a1;--line:#2e3432;--accent:#4fd1b9;--accent-ink:#06201b;--ok:#5cc58a;--warn:#e19a62;--bad:#ff8a80;--soft:#1d2a27;color-scheme:dark}}
:root[data-theme=dark]{--bg:#121514;--card:#1a1e1d;--ink:#e8ecea;--muted:#9ba4a1;--line:#2e3432;--accent:#4fd1b9;--accent-ink:#06201b;--ok:#5cc58a;--warn:#e19a62;--bad:#ff8a80;--soft:#1d2a27;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
header h1 img{width:22px;height:22px}
header .who{margin-left:auto;display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px}
main{max-width:1020px;margin:0 auto;padding:20px 16px 60px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0}
.card h2{margin:0 0 4px;font-size:17px}
.lede{color:var(--muted);margin:0 0 12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px 12px}.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.stat span{color:var(--muted);font-size:13px}
label.f{display:grid;gap:4px;margin:10px 0;font-size:14px}
input[type=text],input[type=password],input[type=number],input[type=date],select{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);width:100%}
button,.btn{font:inherit;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.danger{color:var(--bad)}
button.sm{padding:3px 9px;font-size:13px}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{font-size:14px;margin:8px 0 0;min-height:1em}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.bar.full i{background:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:13px}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
.pill{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.pill.on{color:var(--ok);border-color:currentColor}.pill.wait{color:var(--warn);border-color:currentColor}.pill.off{color:var(--bad);border-color:currentColor}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:6px}.dot.on{background:var(--ok)}
.conf{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;margin-top:12px;padding:14px;border-radius:12px;background:var(--soft)}
.conf svg{width:220px;height:220px;background:#fff;border-radius:8px}
pre{margin:0;font-size:12px;white-space:pre-wrap;word-break:break-all;background:var(--card);padding:10px;border-radius:8px;border:1px solid var(--line)}
.hint{color:var(--muted);font-size:13px}
.warnbox{border-left:3px solid var(--warn);padding:8px 12px;background:var(--soft);border-radius:6px;font-size:14px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;letter-spacing:.04em}
input.mini{width:76px;padding:3px 6px}
details summary{cursor:pointer}
@media (max-width:600px){.conf{grid-template-columns:1fr}.conf svg{width:100%;height:auto;max-width:260px}header{padding:12px 16px}}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1><img src="/icon.svg" alt=""><span id="brand">piii VPN</span></h1><div class="who" id="who"></div></header>
<main id="main"><p class="hint">Loading…</p></main>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const gb = (b) => b >= 1e12 ? (b / 1e12).toFixed(2) + " TB" : b >= 1e9 ? (b / 1e9).toFixed(1) + " GB" : b >= 1e6 ? (b / 1e6).toFixed(1) + " MB" : b >= 1e3 ? Math.round(b / 1e3) + " kB" : (b || 0) + " B";
const day = (t) => t ? new Date(t * 1000).toLocaleDateString() : "no end";
const ago = (t) => { if (!t) return "never"; const s = Date.now() / 1000 - t; return s < 120 ? "now" : s < 3600 ? Math.round(s / 60) + " min ago" : s < 86400 ? Math.round(s / 3600) + " h ago" : new Date(t * 1000).toLocaleDateString(); };
const plan = (a) => a ? gb(a) + " a month" : "unlimited";
async function api(path, opt = {}) {
  const o = { credentials: "same-origin", ...opt, headers: { "X-PVPN": "1", ...(opt.json ? { "Content-Type": "application/json" } : {}), ...(opt.headers || {}) } };
  if (opt.json) o.body = JSON.stringify(opt.json);
  const r = await fetch(path, o);
  let d = null; try { d = await r.json(); } catch (_) {}
  if (!r.ok) { const e = new Error((d && d.detail) || ("The server answered " + r.status)); e.status = r.status; throw e; }
  return d;
}
const fail = (el, e) => { el.className = "msg bad"; el.textContent = e.message; };
let ME = null, PUB = { signup: "approval", provider: "piii VPN" }, TIMER = 0;

async function boot() {
  try { PUB = await api("/api/pvpn/public"); } catch (_) {}
  $("#brand").textContent = PUB.provider; document.title = PUB.provider;
  try { ME = await api("/api/pvpn/me"); } catch (e) { ME = null; }
  render();
}

function render() {
  clearInterval(TIMER);
  const who = $("#who");
  who.innerHTML = ME ? `<span>${esc(ME.name)}${ME.admin ? " · owner" : ""}</span><button id="out">Sign out</button>` : "";
  if (ME) $("#out").onclick = async () => { await api("/api/pvpn/logout", { method: "POST" }); ME = null; render(); };
  const m = $("#main");
  if (!ME) return signedOut(m);
  if (ME.status !== "active") {
    m.innerHTML = `<section class="card"><h2>${ME.status === "pending" ? "Waiting for approval" : "Account turned off"}</h2>
      <p class="lede">${ME.status === "pending" ? "The owner of this server approves new accounts. Come back once they have; there is nothing else to do." : "The owner has turned this account off."}</p></section>`;
    return;
  }
  m.innerHTML = `<section class="card" id="mine"></section>${ME.admin ? '<section class="card" id="admin"></section><section class="card" id="invites"></section><section class="card" id="settings"></section>' : ""}<section class="card" id="acct"></section>`;
  mine(); acctCard(); if (ME.admin) admin();
  // usage and who is online, kept fresh while the page is open
  TIMER = setInterval(() => { if (!document.hidden && !$("#newconf .conf")) { mine(); if (ME.admin) admin(true); } }, 30000);
}

// ---------------------------------------------------------------- signed out
function signedOut(m) {
  const inviteOnly = PUB.signup === "invite";
  m.innerHTML = `
    <section class="card"><h2>A private VPN</h2>
      <p class="lede">Connect your phone or computer with WireGuard and your internet goes through this server, encrypted, from wherever you are.</p></section>
    <div class="grid2">
      <section class="card"><h2>Sign in</h2>
        <form id="in"><label class="f">User name<input type="text" name="name" autocomplete="username" required></label>
        <label class="f">Password<input type="password" name="password" autocomplete="current-password" required></label>
        <button class="primary">Sign in</button><p class="msg" id="inmsg"></p></form></section>
      <section class="card"><h2>Create an account</h2>
        <p class="hint">${inviteOnly ? "You need an invite code from the owner." : PUB.signup === "open" ? "Accounts are open: you can sign in right after." : "With an invite code you can start at once; without one, the owner approves you first."}</p>
        <form id="up"><label class="f">Invite code${inviteOnly ? "" : " (if you have one)"}<input type="text" name="invite" class="code" placeholder="ABCD-1234-EF56" autocomplete="off" ${inviteOnly ? "required" : ""}></label>
        <label class="f">User name<input type="text" name="name" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9_.\\-]{2,31}" required></label>
        <label class="f">Password (10 characters or more)<input type="password" name="password" autocomplete="new-password" minlength="10" required></label>
        <label class="f">A note for the owner (who you are)<input type="text" name="note" maxlength="300"></label>
        <button class="primary">Create the account</button><p class="msg" id="upmsg"></p></form></section>
    </div>`;
  const code = new URLSearchParams(location.search).get("invite"); if (code) $("#up [name=invite]").value = code;
  $("#in").onsubmit = async (e) => {
    e.preventDefault(); const f = new FormData(e.target);
    try { await api("/api/pvpn/login", { method: "POST", json: { name: f.get("name"), password: f.get("password") } }); ME = await api("/api/pvpn/me"); render(); }
    catch (er) { fail($("#inmsg"), er); }
  };
  $("#up").onsubmit = async (e) => {
    e.preventDefault(); const f = new FormData(e.target), msg = $("#upmsg");
    try {
      const d = await api("/api/pvpn/signup", { method: "POST", json: { name: f.get("name"), password: f.get("password"), note: f.get("note"), invite: f.get("invite") } });
      if (d.status === "active") { await api("/api/pvpn/login", { method: "POST", json: { name: f.get("name"), password: f.get("password") } }); ME = await api("/api/pvpn/me"); return render(); }
      msg.className = "msg ok"; msg.textContent = d.message; e.target.reset();
    } catch (er) { fail(msg, er); }
  };
}

// ---------------------------------------------------------------- your VPN
async function mine() {
  const c = $("#mine"); if (!c) return;
  let d; try { ME = await api("/api/pvpn/me"); d = await api("/api/pvpn/devices"); } catch (e) { c.innerHTML = `<h2>Your VPN</h2><p class="msg bad">${esc(e.message)}</p>`; return; }
  const pct = ME.allowance ? Math.min(100, 100 * ME.used / ME.allowance) : 0;
  const keep = $("#newconf") ? $("#newconf").innerHTML : "";
  const rows = d.devices.map((x) => `<tr><td><span class="dot ${x.online ? "on" : ""}"></span>${esc(x.name)}</td><td class="n">${esc(x.ip)}</td>
      <td class="n">${gb(x.tx)} ↓ · ${gb(x.rx)} ↑</td><td>${x.online ? "connected" : ago(x.handshake)}</td>
      <td><button class="danger sm" data-rm="${x.id}">Remove</button></td></tr>`).join("");
  c.innerHTML = `<h2>Your VPN</h2>
    <p class="lede">Install the free WireGuard app, add a device here, and scan its code. Then all that device's internet goes through ${esc(ME.provider)}.</p>
    ${ME.blocked ? `<p class="warnbox"><b>Your devices are off:</b> ${esc(ME.blocked)}.${ME.blocked.includes("used up") ? " They come back on the 1st of next month, or when the owner raises your plan." : ""}</p>` : ""}
    ${!d.vpn ? '<p class="warnbox">The VPN is not switched on on this server yet (development mode): devices are kept but do not connect.</p>' : ""}
    ${d.vpn && !d.endpoint_set ? '<p class="warnbox">The server has no public address set (PVPN_WG_ENDPOINT): new configurations will need it filled in.</p>' : ""}
    <div class="stats">
      <div class="stat"><b>${gb(ME.used)}</b><span>used in ${esc(ME.month)} · ${plan(ME.allowance)}</span>${ME.allowance ? `<div class="bar ${pct >= 100 ? "full" : ""}" style="margin-top:6px"><i style="width:${pct}%"></i></div>` : ""}</div>
      <div class="stat"><b>${d.devices.length} / ${d.max}</b><span>devices</span></div>
      <div class="stat"><b>${day(ME.until)}</b><span>access until</span></div>
    </div>
    ${d.devices.length ? `<div class="tw"><table><thead><tr><th>Device</th><th>Address</th><th>Data (all time)</th><th>Last seen</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="hint">No devices yet.</p>'}
    <form id="addd" class="row" style="margin-top:14px"><input type="text" name="name" placeholder="Device name, e.g. Phone" maxlength="40" required style="max-width:280px">
      <button class="primary" ${d.devices.length >= d.max ? "disabled" : ""}>Add a device</button></form>
    <p class="msg" id="vmsg"></p><div id="newconf">${keep}</div>`;
  if (keep) bindConf();
  c.querySelectorAll("[data-rm]").forEach((b) => b.onclick = async () => {
    if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Sure? It stops connecting"; return; }
    try { await api("/api/pvpn/devices/" + b.dataset.rm, { method: "DELETE" }); mine(); } catch (e) { fail($("#vmsg"), e); }
  });
  $("#addd").onsubmit = async (e) => {
    e.preventDefault(); const f = new FormData(e.target);
    try { const n = await api("/api/pvpn/devices", { method: "POST", json: { name: f.get("name") } }); await mine(); showConf(n); }
    catch (er) { fail($("#vmsg"), er); }
  };
}
let CONF = null;
function showConf(n) {
  CONF = n;
  $("#newconf").innerHTML = `<div class="conf"><div>${n.qr_svg}</div><div>
    <h2>${esc(n.name)} is ready</h2>
    <p class="warnbox"><b>Shown once.</b> Its key is not kept on the server: scan it or save the file now. If it is lost, remove the device and add it again.</p>
    ${n.blocked ? `<p class="warnbox">It will connect once your account is on again (${esc(n.blocked)}).</p>` : ""}
    <ol class="hint"><li>Install WireGuard (App Store, Google Play, or wireguard.com for computers).</li><li>Phone: <b>+</b> → Scan from QR code. Computer: Import tunnel from file.</li><li>Switch it on. To check, look up your IP address: it should be this server's.</li></ol>
    <div class="row"><button class="primary" id="dl">Download ${esc(n.file)}</button><button id="cp">Copy</button><button id="hide">Done</button></div>
    <details style="margin-top:8px"><summary class="hint">Show the configuration</summary><pre>${esc(n.conf)}</pre></details></div></div>`;
  bindConf();
}
function bindConf() {
  if (!CONF || !$("#dl")) return;
  $("#dl").onclick = () => { const a = document.createElement("a"), u = URL.createObjectURL(new Blob([CONF.conf], { type: "text/plain" })); a.href = u; a.download = CONF.file; a.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); };
  $("#cp").onclick = () => navigator.clipboard.writeText(CONF.conf).then(() => $("#cp").textContent = "Copied");
  $("#hide").onclick = () => { $("#newconf").innerHTML = ""; CONF = null; };
}

// ---------------------------------------------------------------- account
function acctCard() {
  const c = $("#acct");
  c.innerHTML = `<h2>Account</h2><form id="pw" class="row" style="align-items:end">
    <label class="f" style="flex:1;min-width:180px">Present password<input type="password" name="old" autocomplete="current-password" required></label>
    <label class="f" style="flex:1;min-width:180px">New password<input type="password" name="new" minlength="10" autocomplete="new-password" required></label>
    <button style="margin:10px 0">Change password</button></form><p class="msg" id="pwmsg"></p>`;
  $("#pw").onsubmit = async (e) => {
    e.preventDefault(); const f = new FormData(e.target);
    try { await api("/api/pvpn/password", { method: "POST", json: { old: f.get("old"), new: f.get("new") } }); ME = null; render(); }
    catch (er) { fail($("#pwmsg"), er); }
  };
}

// ---------------------------------------------------------------- the owner
let OV = null;
async function admin(quiet) {
  const c = $("#admin"); if (!c) return;
  if (quiet && c.contains(document.activeElement) && document.activeElement.tagName === "INPUT") return; // not while typing
  try { OV = await api("/api/pvpn/admin/overview"); } catch (e) { c.innerHTML = `<p class="msg bad">${esc(e.message)}</p>`; return; }
  const s = OV.server, pend = OV.users.filter((u) => u.status === "pending").length;
  const rows = OV.users.map((u) => {
    const st = u.status === "pending" ? ["wait", "waiting"] : u.blocked ? ["off", "off"] : ["on", "on"];
    const pct = u.allowance ? Math.min(100, 100 * u.used / u.allowance) : 0;
    return `<tr data-u="${u.id}">
      <td><b>${esc(u.name)}</b>${u.admin ? ' <span class="pill">owner</span>' : ""}${u.note ? `<div class="hint">${esc(u.note)}</div>` : ""}</td>
      <td><span class="pill ${st[0]}" title="${esc(u.blocked)}">${st[1]}</span>${u.blocked && u.status !== "pending" ? `<div class="hint">${esc(u.blocked)}</div>` : ""}</td>
      <td class="n">${gb(u.used)}<div class="hint">of <input class="mini" type="number" min="0" step="1" value="${u.allowance ? Math.round(u.allowance / 1e9) : 0}" data-gb> GB${u.allowance ? "" : " (0 = unlimited)"}</div>${u.allowance ? `<div class="bar ${pct >= 100 ? "full" : ""}"><i style="width:${pct}%"></i></div>` : ""}</td>
      <td class="n">${u.online} on / ${u.devices}<div class="hint">max <input class="mini" type="number" min="0" max="100" value="${u.max_devices}" data-dev></div></td>
      <td class="n">${day(u.until)}<div class="row" style="gap:4px;margin-top:4px"><button class="sm" data-ext="30">+30 d</button>${u.until ? '<button class="sm" data-noend>No end</button>' : ""}</div></td>
      <td><div class="row" style="gap:4px">${u.status !== "active" ? '<button class="primary sm" data-st="active">Approve</button>' : u.admin ? "" : '<button class="sm" data-st="disabled">Turn off</button>'}
        ${u.used ? '<button class="sm" data-reset>Reset month</button>' : ""}${u.admin ? "" : '<button class="danger sm" data-del>Delete</button>'}</div></td></tr>`;
  }).join("");
  const devs = OV.devices.map((d) => `<tr><td><span class="dot ${d.online ? "on" : ""}"></span>${esc(d.name)}</td><td>${esc(d.owner)}</td><td class="n">${esc(d.ip)}</td>
      <td class="n">${esc(d.endpoint || "—")}</td><td class="n">${gb(d.tx)} ↓ · ${gb(d.rx)} ↑</td><td>${d.online ? "connected" : ago(d.handshake)}</td>
      <td><button class="danger sm" data-rmd="${d.id}">Remove</button></td></tr>`).join("");
  c.innerHTML = `<h2>Your service ${pend ? `<span class="pill wait">${pend} waiting</span>` : ""}</h2>
    <div class="stats">
      <div class="stat"><b>${s.online}</b><span>devices connected now</span></div>
      <div class="stat"><b>${OV.users.length}</b><span>people</span></div>
      <div class="stat"><b>${gb(s.month_bytes)}</b><span>through the VPN in ${esc(s.month)}</span></div>
      <div class="stat"><b class="code" style="font-size:14px;word-break:break-all">${esc(s.endpoint || "not set")}</b><span>public address</span></div>
    </div>
    <p class="warnbox">Everyone's traffic leaves from your home connection: what they do online looks as if it came from you. Let in only people you trust, and check your internet provider allows it.</p>
    <h3 style="font-size:15px;margin:16px 0 4px">People</h3>
    <div class="tw"><table><thead><tr><th>Person</th><th>State</th><th>This month</th><th>Devices</th><th>Access until</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <details style="margin-top:14px"><summary><b>All devices</b> <span class="hint">(${OV.devices.length})</span></summary>
      <div class="tw">${OV.devices.length ? `<table><thead><tr><th>Device</th><th>Person</th><th>Address</th><th>Connects from</th><th>Data</th><th>Last seen</th><th></th></tr></thead><tbody>${devs}</tbody></table>` : '<p class="hint">None yet.</p>'}</div></details>
    <details style="margin-top:8px"><summary><b>What happened</b></summary><div class="hint">${OV.log.map((l) => `${new Date(l.at * 1000).toLocaleString()} · ${esc(l.what)}`).join("<br>") || "Nothing yet."}</div></details>
    <p class="msg" id="amsg"></p>`;
  const set = async (uid, b) => { try { await api("/api/pvpn/admin/users/" + uid, { method: "POST", json: b }); admin(); mine(); } catch (e) { fail($("#amsg"), e); } };
  c.querySelectorAll("tr[data-u]").forEach((tr) => {
    const uid = tr.dataset.u;
    tr.querySelectorAll("[data-st]").forEach((b) => b.onclick = () => set(uid, { status: b.dataset.st }));
    tr.querySelector("[data-gb]").onchange = (e) => set(uid, { allowance_gb: +e.target.value });
    tr.querySelector("[data-dev]").onchange = (e) => set(uid, { max_devices: +e.target.value });
    tr.querySelector("[data-ext]").onclick = () => set(uid, { extend_days: 30 });
    const ne = tr.querySelector("[data-noend]"); if (ne) ne.onclick = () => set(uid, { until: 0 });
    const rs = tr.querySelector("[data-reset]"); if (rs) rs.onclick = () => set(uid, { reset_usage: true });
    const del = tr.querySelector("[data-del]");
    if (del) del.onclick = async () => {
      if (del.dataset.sure !== "1") { del.dataset.sure = "1"; del.textContent = "Delete with their devices?"; return; }
      try { await api("/api/pvpn/admin/users/" + uid, { method: "DELETE" }); admin(); } catch (er) { fail($("#amsg"), er); }
    };
  });
  c.querySelectorAll("[data-rmd]").forEach((b) => b.onclick = async () => {
    if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Sure?"; return; }
    try { await api("/api/pvpn/admin/devices/" + b.dataset.rmd, { method: "DELETE" }); admin(); mine(); } catch (e) { fail($("#amsg"), e); }
  });
  if (!quiet) { invites(); settingsCard(); }
}

function invites() {
  const c = $("#invites"), S = OV.settings;
  const link = (code) => location.origin + "/?invite=" + encodeURIComponent(code);
  const rows = OV.invites.map((i) => `<tr><td class="code">${esc(i.code)}</td><td>${plan(i.allowance)}</td><td>${i.max_devices}</td><td>${i.days ? i.days + " days" : "no end"}</td>
      <td>${i.uses}</td><td>${esc(i.note)}</td><td><div class="row" style="gap:4px"><button class="sm" data-copy="${esc(i.code)}">Copy link</button><button class="danger sm" data-drop="${esc(i.code)}">Cancel</button></div></td></tr>`).join("");
  c.innerHTML = `<h2>Invite codes</h2>
    <p class="lede">A code lets someone in at once, with the plan you choose here. Send them the link.</p>
    <form id="inv" class="row" style="align-items:end">
      <label class="f">GB a month (0 = unlimited)<input type="number" name="gb" min="0" value="${S.default_gb}" style="width:150px"></label>
      <label class="f">Devices<input type="number" name="dev" min="1" max="100" value="${S.default_devices}" style="width:90px"></label>
      <label class="f">Days of access (0 = no end)<input type="number" name="days" min="0" value="${S.default_days}" style="width:150px"></label>
      <label class="f">People it admits<input type="number" name="uses" min="1" value="1" style="width:110px"></label>
      <label class="f" style="flex:1;min-width:140px">Note (for you)<input type="text" name="note" maxlength="120" placeholder="e.g. for Sara"></label>
      <button class="primary" style="margin:10px 0">Make a code</button></form>
    <p class="msg" id="imsg"></p>
    ${OV.invites.length ? `<div class="tw"><table><thead><tr><th>Code</th><th>Plan</th><th>Devices</th><th>Access</th><th>Left</th><th>Note</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : ""}`;
  $("#inv").onsubmit = async (e) => {
    e.preventDefault(); const f = new FormData(e.target);
    try {
      const d = await api("/api/pvpn/admin/invites", { method: "POST", json: { allowance_gb: +f.get("gb"), max_devices: +f.get("dev"), days: +f.get("days"), uses: +f.get("uses"), note: f.get("note") } });
      await admin(); $("#imsg").className = "msg ok"; $("#imsg").innerHTML = `Code <b class="code">${esc(d.code)}</b> · link: <span class="code">${esc(link(d.code))}</span>`;
    } catch (er) { fail($("#imsg"), er); }
  };
  c.querySelectorAll("[data-copy]").forEach((b) => b.onclick = () => navigator.clipboard.writeText(link(b.dataset.copy)).then(() => b.textContent = "Copied"));
  c.querySelectorAll("[data-drop]").forEach((b) => b.onclick = async () => { try { await api("/api/pvpn/admin/invites/" + encodeURIComponent(b.dataset.drop), { method: "DELETE" }); admin(); } catch (e) { fail($("#imsg"), e); } });
}

function settingsCard() {
  const c = $("#settings"), S = OV.settings, s = OV.server;
  c.innerHTML = `<h2>Settings</h2>
    <form id="set">
      <div class="grid2">
        <label class="f">Name of your service<input type="text" name="provider" maxlength="40" value="${esc(S.provider)}"></label>
        <label class="f">How people join<select name="signup">
          <option value="approval" ${S.signup === "approval" ? "selected" : ""}>Sign up, then I approve (or an invite code)</option>
          <option value="invite" ${S.signup === "invite" ? "selected" : ""}>Invite code only</option>
          <option value="open" ${S.signup === "open" ? "selected" : ""}>Open: anyone, at once</option></select></label>
      </div>
      <p class="hint" style="margin:10px 0 0">The plan a newly approved person starts with:</p>
      <div class="row">
        <label class="f">GB a month (0 = unlimited)<input type="number" name="default_gb" min="0" value="${S.default_gb}" style="width:150px"></label>
        <label class="f">Devices<input type="number" name="default_devices" min="1" max="100" value="${S.default_devices}" style="width:90px"></label>
        <label class="f">Days of access (0 = no end)<input type="number" name="default_days" min="0" value="${S.default_days}" style="width:150px"></label>
      </div>
      <button class="primary">Save</button></form><p class="msg" id="smsg"></p>
    <p class="hint" style="margin-top:12px">Server: piii VPN ${esc(s.version)} · VPN addresses ${esc(s.net)} · DNS for devices ${esc(s.dns)}. On the VPN, this page is also at <span class="code">http://10.77.0.1</span>.</p>`;
  $("#set").onsubmit = async (e) => {
    e.preventDefault(); const f = new FormData(e.target);
    try {
      const d = await api("/api/pvpn/admin/settings", { method: "POST", json: { provider: f.get("provider"), signup: f.get("signup"), default_gb: +f.get("default_gb"), default_devices: +f.get("default_devices"), default_days: +f.get("default_days") } });
      $("#brand").textContent = d.provider; $("#smsg").className = "msg ok"; $("#smsg").textContent = "Saved.";
    } catch (er) { fail($("#smsg"), er); }
  };
}
boot();
</script>
</body>
</html>
