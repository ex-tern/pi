[package]
name = "numbers"
version = "1.0.0"
edition = "2021"
description = "π, e, φ and γ to many digits, exactly: the site's constants, in Rust (no dependencies; no_std for wasm32)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
strip = true
