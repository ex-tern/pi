<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- The link carries a private token: keep it out of search engines and out
     of the Referer header of anything this page might link to. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Permission request · Pi Tech Lab</title>
<link rel="icon" type="image/svg+xml" href="../icon.svg">
<link rel="preload" href="../fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="confirm.css">
</head>
<body>
<main class="sheet" id="sheet" aria-live="polite">
  <a class="brand" href="/" aria-label="Pi Tech Lab home">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="13" fill="none" stroke="#191919" stroke-width="1.6"/>
      <line x1="16" y1="16" x2="29" y2="16" stroke="#2f40e8" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="16" y1="16" x2="3" y2="16" stroke="#2f40e8" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <span>Pi Tech Lab</span>
  </a>

  <div id="loading"><p class="quiet">Loading the request…</p></div>

  <div id="request" hidden>
    <p class="kicker">Permission request</p>
    <h1 id="title"></h1>
    <p class="parties"><span id="from"></span><span id="to"></span></p>
    <div id="message" class="message"></div>

    <h2>What you are agreeing to</h2>
    <ul id="terms" class="terms"></ul>

    <div id="current" class="current" hidden></div>

    <form id="form" novalidate>
      <label for="name">Your name</label>
      <input id="name" name="name" type="text" autocomplete="name" required minlength="2" maxlength="120">
      <label for="note">Note <span class="quiet">(optional)</span></label>
      <textarea id="note" name="note" rows="3" maxlength="2000" placeholder="Any conditions or comments"></textarea>
      <div class="actions">
        <button type="submit" class="yes" data-decision="granted">I give permission</button>
        <button type="submit" class="no" data-decision="declined">I decline</button>
      </div>
      <p class="error" id="error" role="alert" hidden></p>
      <p class="small">Your answer is recorded with the date, your name and the exact terms above, as a written record for both sides.
      You can change it later from this same link.</p>
    </form>
  </div>

  <div id="done" hidden></div>
  <div id="problem" hidden></div>
</main>
<script src="confirm.js"></script>
</body>
</html>
